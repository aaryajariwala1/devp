name: taka_track
description: Textile inventory tracker for jacquard fabric rolls.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Local database (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.3+1

  # Camera (fabric scanning)
  camera: ^0.10.5+9

  # Image compression (500x500 before upload)
  flutter_image_compress: ^2.1.0

  # Cached images for design thumbnails
  cached_network_image: ^3.3.1

  # UI — shimmer skeletons & Google Fonts
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # Utilities
  path_provider: ^2.1.3
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
