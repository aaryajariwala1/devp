workflows:
  android-debug:
    name: TakaTrack Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter version
        script: flutter --version

      - name: Install dependencies
        script: flutter pub get

      - name: Analyze code
        script: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        script: |
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - aarya@dev.com
        notify:
          success: true
          failure: true
